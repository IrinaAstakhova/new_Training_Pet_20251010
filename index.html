<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="profile.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="todo.js"></script>
    <script type="module" src="helpers.js" defer></script>
    <script src="profile.js" type="module" defer></script>
    
    <title>Профиль пользователя</title>
</head>
<body>
    <label class="theme-switch">
        <input type="checkbox" class="theme-checkbox">
        <span class="slider"></span>
    </label>
    <div class="container-todo-list">
        <h3>Список задач</h3>
        <div class="todo-task">
            <input type="text" data-input-todo placeholder="input todo">
            <button data-btn-add-todo>add todo</button>
        </div>
        <hr>
        <div class="todo-list"></div>
    </div>
    <div class="container-purchase">
        <h3>Список моих покупок</h3>
        <div class="wrapper-container-filter_purchase">
            <div class="filter_purchase">
                <button class="all">🧺 Все покупки</button>
                <button class="completed">✅ Завершенные</button>
                <button class="unfinished">❎ Активые</button>
            </div>
            <div class="container-reset_purchase">
                <input type="text" class="search_purchase" placeholder="Поиск внутри списка товаров">
                <button class="btn-reset_purchase">🚫 Очистить весь список покупок</button>
            </div>
        </div>
        <div class="wrapper-purchase">
            <input type="text" class="input-purchase" placeholder="Введите товар для добавления">
            <button class="btn-add_purchase">🛒 Добавить товар</button>
            <div class="list_purchase">
                <ul></ul>
            </div>
        </div>
    </div>
    <div class="wrapper-guess-container">
    <h3>Угадай число</h3>
    <p class="paragrafh">(от 1 до 30 включительно)</p>
    <div class="container-play">
        <div class="column1">        
            <div class="text-guess">Начнем?</div>
            <div class="text-number">❓</div>
        </div>
        <div class="column2">
            <div class="wrapper-score">
                <div class="score">🎯 Количество попыток: 30</div>
                <div class="record">🏆 Твой рекорд равен: 0</div>
            </div>
            
            <input type="number" placeholder="Введите число" class="input-game-number">
            <button class="clicker"> Угадать</button>
            <button class="rest"> Начать заново</button>
        </div>
    </div>
</div>
</body>
</html>
