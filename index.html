<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="profile.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="profile.js" defer></script>
    <title>Профиль пользователя</title>
</head>
<body>
    <h3>Угадай число</h3>
    <p class="paragrafh">(от 1 до 30 включительно)</p>
    <div class="container-play">
        <div class="column1">        
            <div class="text-guess">Начнем?</div>
            <div class="text-number">❓</div>
        </div>
        <div class="column2">
            <div class="wrapper-score">
                <div class="score">🎯 Количество попыток: 30</div>
                <div class="record">🏆 Твой рекорд равен: 0</div>
            </div>
            
            <input type="number" placeholder="Введите число">
            <button class="clicker"> Угадать</button>
            <button class="rest"> Начать заново</button>
        </div>
    </div>
</body>
</html>
